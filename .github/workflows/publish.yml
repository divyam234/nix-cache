name: publish

on:
  workflow_dispatch:
  repository_dispatch:
    types: [dotfiles-flake-updated]

permissions:
  contents: write

concurrency:
  group: cache-release
  cancel-in-progress: false

env:
  CACHE_PUBLIC_KEY: nix-cache-1:833kjCWb6yhgpaUIez65hOJBJUZDkns+ybXW/WJMsYI=
  RELEASE_TAG: cache-${{ github.run_id }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            --draft \
            --title "Nix cache $RELEASE_TAG" \
            --notes "Immutable raw NAR chunks generated by workflow run $GITHUB_RUN_ID."

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            prefix: x86-64
            targets: |
              nixosConfigurations.laptop.config.system.build.toplevel
              nixosConfigurations.homelab.config.system.build.toplevel
              homeConfigurations."bhunter@laptop".activationPackage
          - runner: ubuntu-24.04-arm
            prefix: aarch64
            targets: |
              nixosConfigurations.netcup.config.system.build.toplevel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: divyam234/dotfiles
          path: dotfiles
          ref: ${{ github.event.client_payload.sha || 'main' }}
      - uses: DeterminateSystems/nix-installer-action@v20
        with:
          extra-conf: |
            extra-substituters = https://attic.xuyh0120.win/lantian
            extra-trusted-public-keys = lantian:EeAUQ+W+6r7EtwnmYjeVwx5kOGEBpjlBfPlzGlTNvHc=
      - name: Build closures
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          mapfile -t targets <<< "$TARGETS"
          installables=()
          for target in "${targets[@]}"; do
            [[ -n "$target" ]] && installables+=("./dotfiles#$target")
          done
          nix build --no-link --print-out-paths "${installables[@]}" > "$RUNNER_TEMP/outputs"
          mapfile -t outputs < "$RUNNER_TEMP/outputs"
          nix path-info --recursive "${outputs[@]}" > "$RUNNER_TEMP/closure-paths"
          nix build .#nix-cache --out-link "$RUNNER_TEMP/tool"
          "$RUNNER_TEMP/tool/bin/nix-cache" filter-upstream \
            --paths-file "$RUNNER_TEMP/closure-paths" \
            --output "$RUNNER_TEMP/selected-paths"
      - name: Export signed raw chunks
        env:
          CACHE_SIGNING_KEY: ${{ secrets.CACHE_SIGNING_KEY }}
        run: |
          install -m 0600 /dev/null "$RUNNER_TEMP/cache-key"
          printf '%s\n' "$CACHE_SIGNING_KEY" > "$RUNNER_TEMP/cache-key"
          "$RUNNER_TEMP/tool/bin/nix-cache" export \
            --paths-file "$RUNNER_TEMP/selected-paths" \
            --output "$RUNNER_TEMP/release" \
            --asset-base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG" \
            --prefix "${{ matrix.prefix }}-$GITHUB_RUN_ATTEMPT" \
            --public-key "$CACHE_PUBLIC_KEY" \
            --signing-key "$RUNNER_TEMP/cache-key" \
            --index-name "shard-${{ matrix.prefix }}.json"
          rm -f "$RUNNER_TEMP/cache-key"
      - name: Upload chunks and shard index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          assets=("$RUNNER_TEMP/release"/chunk-*.bin "$RUNNER_TEMP/release"/shard-*.json)
          gh release upload "$RELEASE_TAG" "${assets[@]}"

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@v20
      - name: Merge indexes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          nix build .#nix-cache --out-link "$RUNNER_TEMP/tool"
          mkdir -p "$RUNNER_TEMP/indexes"
          gh release download "$RELEASE_TAG" --pattern 'shard-*.json' --dir "$RUNNER_TEMP/indexes"
          indexes=("$RUNNER_TEMP/indexes"/*.json)
          "$RUNNER_TEMP/tool/bin/nix-cache" merge \
            --public-key "$CACHE_PUBLIC_KEY" \
            --output "$RUNNER_TEMP/index.json" \
            "${indexes[@]}"
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/index.json"
      - name: Publish release atomically
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
      - name: Retain two cache generations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t stale_tags < <(
            # shellcheck disable=SC2016
            gh release list --limit 1000 \
              --json tagName,isDraft,publishedAt \
              --jq '
                map(select(.tagName | startswith("cache-"))) as $cache |
                ($cache |
                  map(select(.isDraft == false)) |
                  sort_by(.publishedAt) |
                  reverse |
                  .[:2] |
                  map(.tagName)) as $keep |
                $cache[] |
                select(.tagName as $tag | $keep | index($tag) | not) |
                .tagName
              '
          )
          for tag in "${stale_tags[@]}"; do
            gh release delete "$tag" --cleanup-tag --yes
          done
